# Reversible app overlay for the original taasim project and existing volumes.
# docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
name: taasim
services:
  kafka:
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 10s
      timeout: 10s
      retries: 30
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  postgres:
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U taasim -d taasim
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 30
  cassandra:
    healthcheck:
      test:
      - CMD-SHELL
      - cqlsh -e "DESCRIBE KEYSPACES"
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
  cassandra-init:
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
    - cqlsh
    - cassandra
    - '9042'
    - -f
    - /schema.cql
  kafka-init:
    depends_on:
      kafka:
        condition: service_healthy
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: taasim/auth-service:local
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-me-it-must-be-256-bits-long-abcd1234}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: taasim
      POSTGRES_USER: taasim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taasim}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: '9042'
      CASSANDRA_DC: datacenter1
      CASSANDRA_KEYSPACE: taasim
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      GEOSPATIAL_SERVICE_URL: http://geospatial-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
      AUTH_SERVICE_URI: http://auth-service:8081
      TRIP_SERVICE_URI: http://trip-service:8082
      DRIVER_SERVICE_URI: http://driver-service:8083
      GEO_SERVICE_URI: http://geospatial-service:8084
      BILLING_SERVICE_URI: http://billing-service:8086
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder_change_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      BILLING_AUTO_CHARGE: 'false'
      JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC
      MANAGEMENT_TRACING_ENABLED: ${TRACING_ENABLED:-true}
      SERVER_PORT: '8081'
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      LOG_LEVEL_KAFKA: INFO
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: 'true'
      SPRING_FLYWAY_BASELINE_VERSION: '0'
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8081/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 18
    container_name: taasim-auth
    ports:
    - 8081:8081
