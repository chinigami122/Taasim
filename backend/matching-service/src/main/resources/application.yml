server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: matching-service

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:taasim}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:matching-service-v2}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      type: single
      missing-topics-fatal: false

logging:
  level:
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:DEBUG}
    org.apache.kafka.clients.consumer: ${LOG_LEVEL_CONSUMER:INFO}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}