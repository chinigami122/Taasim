server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: matching-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:matching-service-v2}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      type: single
      missing-topics-fatal: false

geospatial:
  service:
    url: ${GEOSPATIAL_SERVICE_URL:http://localhost:8084}

matching:
  search-radius-meters: ${MATCHING_SEARCH_RADIUS_METERS:5000}

resilience4j:
  circuitbreaker:
    instances:
      geospatial:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      geospatial:
        max-attempts: 3
        wait-duration: 150ms
        exponential-backoff-multiplier: 2

logging:
  level:
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:DEBUG}
    org.apache.kafka.clients.consumer: ${LOG_LEVEL_CONSUMER:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always