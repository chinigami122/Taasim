server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:taasim}
    username: ${POSTGRES_USER:taasim}
    password: ${POSTGRES_PASSWORD:taasim}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Only validates entity mappings match existing schema
    show-sql: true              # Log SQL queries for debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true   # Allows Flyway to baseline an existing DB
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
