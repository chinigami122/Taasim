server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: trip-service
          uri: ${TRIP_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/trips/**

        - id: driver-service
          uri: ${DRIVER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/drivers/**

        - id: geospatial-service
          uri: ${GEO_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/internal/**

        - id: billing-service
          uri: ${BILLING_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/billing/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"    # Client React app
              - "http://localhost:3002"    # Driver React app
              - "http://localhost:3003"    # Admin React app
              - "http://localhost:5173"    # Vite default dev server
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
