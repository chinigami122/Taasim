server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway, taasim-gateway

      routes:
        # Rate-limited login route
        - id: auth-login
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        # General auth routes (registration, etc.)
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Trip service routes
        - id: trip-service
          uri: ${TRIP_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/trips/**

        # Rate-limited driver location telemetry
        - id: driver-location
          uri: ${DRIVER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/drivers/location
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        # Admin routes (Slice 20)
        - id: admin-driver
          uri: ${DRIVER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/admin/drivers, /api/admin/drivers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: admin-trip
          uri: ${TRIP_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/admin/trips, /api/admin/trips/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: admin-billing
          uri: ${BILLING_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/admin/billing, /api/admin/billing/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"

        # Driver earnings route (billing-service)
        - id: driver-earnings
          uri: ${BILLING_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/drivers/earnings/**

        # WebSocket live driver tracking route (driver-service)
        - id: ws-tracking
          uri: ${DRIVER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/ws/tracking/**

        # General driver service routes
        - id: driver-service
          uri: ${DRIVER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/drivers/**

        # Geospatial internal routes (future)
        - id: geospatial-service
          uri: ${GEO_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/internal/**

        # Billing routes (future)
        - id: billing-service
          uri: ${BILLING_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/billing/**

      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-it-must-be-256-bits-long-abcd1234}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://tempo:4318/v1/traces}
