server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: billing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:taasim}
    username: ${POSTGRES_USER:taasim}
    password: ${POSTGRES_PASSWORD:taasim}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    table: flyway_billing_history
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:billing-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Fare calculation configuration
billing:
  fare:
    base: ${FARE_BASE:5.00}
    per-km: ${FARE_PER_KM:3.50}
    per-minute: ${FARE_PER_MIN:0.50}
    surge-min: ${FARE_SURGE_MIN:1.0}
    surge-max: ${FARE_SURGE_MAX:2.5}
    commission-rate: ${FARE_COMMISSION:0.15}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: always
