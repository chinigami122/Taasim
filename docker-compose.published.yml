# TaaSim — Published Production/Staging Compose File
# ===================================================
# Runs pre-built Docker images directly from GitHub Container Registry (GHCR)
# without requiring local source code compilation or build steps.

services:
  gateway-service:
    image: ghcr.io/chinigami122/taasim/gateway-service:latest
    container_name: taasim-gateway
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AUTH_SERVICE_URI: http://auth-service:8081
      TRIP_SERVICE_URI: http://trip-service:8082
      DRIVER_SERVICE_URI: http://driver-service:8083
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  auth-service:
    image: ghcr.io/chinigami122/taasim/auth-service:latest
    container_name: taasim-auth
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  driver-service:
    image: ghcr.io/chinigami122/taasim/driver-service:latest
    container_name: taasim-driver
    env_file: .env
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  trip-service:
    image: ghcr.io/chinigami122/taasim/trip-service:latest
    container_name: taasim-trip
    env_file: .env
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  matching-service:
    image: ghcr.io/chinigami122/taasim/matching-service:latest
    container_name: taasim-matching
    env_file: .env
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_CONSUMER_GROUP: matching-service-docker
      LOG_LEVEL_KAFKA: INFO
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

networks:
  taasim-net:
    external: true
    name: taasim_default
