name: smoke-test
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package services
        run: mvn -B -f backend/pom.xml package -DskipTests
      - name: Start isolated demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build --wait --wait-timeout 360
      - name: Wait for gateway
        run: node scripts/wait_for_stack.mjs
      - name: Exercise real ride lifecycle
        run: node scripts/smoke_demo.mjs
      - name: k6 request/status smoke
        run: |
          mkdir -p tests/load/results
          chmod 777 tests/load/results
          docker run --rm --network host -e SMOKE=1 -v "$PWD/tests/load:/scripts:ro" -v "$PWD/tests/load/results:/results" grafana/k6:1.3.0 run --summary-export=/results/summary.json /scripts/full_flow.js
      - name: Collect logs
        if: always()
        run: docker compose -f docker-compose.demo.yml logs --no-color > smoke-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            smoke-logs.txt
            tests/load/results/summary.json
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.demo.yml down
