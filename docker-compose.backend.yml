# TaaSim backend services — Optimized Dev Configuration
# =======================================================
# Brings up the Spring Boot services with JVM & Docker resource
# constraints to minimize CPU and RAM footprint on the development machine.

services:
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: taasim/auth-service:local
    container_name: taasim-auth
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  driver-service:
    build:
      context: ./backend
      dockerfile: driver-service/Dockerfile
    image: taasim/driver-service:local
    container_name: taasim-driver
    env_file: .env
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      GEOSPATIAL_SERVICE_URL: http://geospatial-service:8084
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  trip-service:
    build:
      context: ./backend
      dockerfile: trip-service/Dockerfile
    image: taasim/trip-service:local
    container_name: taasim-trip
    env_file: .env
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  matching-service:
    build:
      context: ./backend
      dockerfile: matching-service/Dockerfile
    image: taasim/matching-service:local
    container_name: taasim-matching
    env_file: .env
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_CONSUMER_GROUP: matching-service-docker
      GEOSPATIAL_SERVICE_URL: http://geospatial-service:8084
      LOG_LEVEL_KAFKA: INFO
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  geospatial-service:
    build:
      context: ./backend
      dockerfile: geospatial-service/Dockerfile
    image: taasim/geospatial-service:local
    container_name: taasim-geospatial
    env_file: .env
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  billing-service:
    build:
      context: ./backend
      dockerfile: billing-service/Dockerfile
    image: taasim/billing-service:local
    container_name: taasim-billing
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: "8086"
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: taasim
      POSTGRES_USER: taasim
      POSTGRES_PASSWORD: taasim
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_CONSUMER_GROUP: billing-service-docker
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    image: taasim/gateway-service:local
    container_name: taasim-gateway
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      AUTH_SERVICE_URI: http://auth-service:8081
      TRIP_SERVICE_URI: http://trip-service:8082
      DRIVER_SERVICE_URI: http://driver-service:8083
      GEO_SERVICE_URI: http://geospatial-service:8084
      BILLING_SERVICE_URI: http://billing-service:8086
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

networks:
  taasim-net:
    external: true
    name: taasim_default
