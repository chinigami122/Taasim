# TaaSim backend services — Optimized Dev Configuration
# =======================================================
# Brings up the Spring Boot services with JVM & Docker resource
# constraints to minimize CPU and RAM footprint on the development machine.

services:
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: taasim/auth-service:local
    container_name: taasim-auth
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  driver-service:
    build:
      context: ./backend
      dockerfile: driver-service/Dockerfile
    image: taasim/driver-service:local
    container_name: taasim-driver
    env_file: .env
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  trip-service:
    build:
      context: ./backend
      dockerfile: trip-service/Dockerfile
    image: taasim/trip-service:local
    container_name: taasim-trip
    env_file: .env
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

  matching-service:
    build:
      context: ./backend
      dockerfile: matching-service/Dockerfile
    image: taasim/matching-service:local
    container_name: taasim-matching
    env_file: .env
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: taasim
      CASSANDRA_DC: datacenter1
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_CONSUMER_GROUP: matching-service-docker
      LOG_LEVEL_KAFKA: INFO
      JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx256m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - taasim-net
    restart: unless-stopped

networks:
  taasim-net:
    external: true
    name: taasim_default
